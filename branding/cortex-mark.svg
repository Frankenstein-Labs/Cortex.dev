<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Cortex.dev mark</title>
  <desc id="desc">Four rounded color panels forming the Cortex.dev app mark.</desc>
  <defs>
    <linearGradient id="panelA" x1="120" y1="120" x2="470" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#18B6E8"/><stop offset="1" stop-color="#087FC4"/></linearGradient>
    <linearGradient id="panelB" x1="550" y1="120" x2="900" y2="470" gradientUnits="userSpaceOnUse"><stop stop-color="#4D8CFF"/><stop offset="1" stop-color="#3158D9"/></linearGradient>
    <linearGradient id="panelC" x1="120" y1="550" x2="470" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#5B62E8"/><stop offset="1" stop-color="#3A35B8"/></linearGradient>
    <linearGradient id="panelD" x1="550" y1="550" x2="900" y2="900" gradientUnits="userSpaceOnUse"><stop stop-color="#A24BEA"/><stop offset="1" stop-color="#6E2CB9"/></linearGradient>
  </defs>
  <rect x="96" y="96" width="370" height="370" rx="58" fill="url(#panelA)"/>
  <rect x="558" y="96" width="370" height="370" rx="58" fill="url(#panelB)"/>
  <rect x="96" y="558" width="370" height="370" rx="58" fill="url(#panelC)"/>
  <rect x="558" y="558" width="370" height="370" rx="58" fill="url(#panelD)"/>
  <path d="M512 388V636" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="28" stroke-linecap="round"/>
  <path d="M388 512H636" stroke="#FFFFFF" stroke-opacity="0.78" stroke-width="28" stroke-linecap="round"/>
  <circle cx="512" cy="512" r="34" fill="#FFFFFF"/>
</svg>
