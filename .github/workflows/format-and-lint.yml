name: Check Format and Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install root dependencies
        run: npm ci

      - name: Install Cortex-Agent dependencies
        run: |
          npm ci --prefix extensions/Cortex-Agent
          npm ci --prefix extensions/Cortex-Agent/webview-ui
          npm ci --prefix extensions/Cortex-Agent/e2e

      - name: Run Prettier
        run: npx prettier --check './extensions/Cortex-Agent/**/src/**/*.{ts,tsx}'

      - name: Run ESLint
        run: npm --prefix extensions/Cortex-Agent run lint
