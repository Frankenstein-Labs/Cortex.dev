name: Check Format and Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install system dependencies
        run: sudo apt-get install -y libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier
        run: npx prettier --check './extensions/Cortex-Agent/src/**/*.{ts,tsx}'

      - name: Run ESLint
        run: npm ci --prefix extensions/Cortex-Agent && ESLINT_USE_FLAT_CONFIG=false npx eslint -c extensions/Cortex-Agent/.eslintrc.json 'extensions/Cortex-Agent/src/**/*.ts'
