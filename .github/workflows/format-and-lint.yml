name: Check Format and Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --prefix extensions/Cortex-Agent

      - name: Run Type Checks
        run: npm run check-types --prefix extensions/Cortex-Agent

      - name: Run ESLint
        run: npm run lint --prefix extensions/Cortex-Agent
